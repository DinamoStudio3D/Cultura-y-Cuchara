(async function(){const p=new URLSearchParams(location.search),id=p.get('id'),viewer=document.getElementById('viewer'),titleEl=document.getElementById('title'),descEl=document.getElementById('description');let url=p.get('image')||'',title=p.get('title')||'Menú digital',desc=p.get('description')||'Consulta nuestro menú actualizado.';if(id){if(!/^[a-z0-9_-]{1,100}$/i.test(id)){viewer.innerHTML='<div class="notice">Identificador de menú inválido.</div>';return;}try{const app=firebase.initializeApp({apiKey:'AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE',authDomain:'cultura-y-cuchara.firebaseapp.com',projectId:'cultura-y-cuchara',appId:'1:974351327730:web:08573026a46d1bb6598b6b'},'qrMenuViewer');const snapshot=await app.firestore().collection('qrCodes').doc(id).get();const data=snapshot.exists?snapshot.data():null;if(!data||!data.menuImageUrl){viewer.innerHTML='<div class="notice">Este menú aún no tiene una imagen publicada.</div>';return;}url=data.menuImageUrl;title=data.name||title;desc='Consulta nuestro menú actualizado.';}catch(_){viewer.innerHTML='<div class="notice">No se pudo consultar el menú. Comprueba tu conexión o los permisos de lectura.</div>';return;}}else if(!url){viewer.innerHTML='<div class="notice">Esta es la página de visualización. Para ver un menú, primero créalo desde el generador QR del administrador y abre su enlace.</div>';return;}titleEl.textContent=String(title).slice(0,110);descEl.textContent=String(desc).slice(0,250);document.title=titleEl.textContent+' | VisitaLoja.com';let parsed;try{parsed=new URL(url);if(parsed.protocol!=='https:'||parsed.username||parsed.password||!['res.cloudinary.com','images.unsplash.com','i.imgur.com'].includes(parsed.hostname))throw Error('unsupported');}catch(_){viewer.innerHTML='<div class="notice">La imagen publicada no tiene una dirección segura compatible.</div>';return;}const img=document.createElement('img');img.alt='Imagen del menú: '+titleEl.textContent;img.loading='eager';img.referrerPolicy='no-referrer';img.onerror=()=>{viewer.innerHTML='<div class="notice">No se pudo cargar la imagen del menú. Inténtalo más tarde.</div>'};img.src=parsed.href;viewer.replaceChildren(img);const link=document.createElement('a');link.href=parsed.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='⤢ Abrir imagen en tamaño completo';document.getElementById('actions').replaceChildren(link)})();
