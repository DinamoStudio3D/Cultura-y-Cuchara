<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Menú digital | VisitaLoja.com</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#183849;background:#f5f4ef}*{box-sizing:border-box}body{margin:0}.top{background:#123f52;color:white;padding:18px 20px;text-align:center}.top a{color:white;text-decoration:none;font-weight:800}.wrap{max-width:880px;margin:24px auto;padding:0 16px;text-align:center}h1{font:700 clamp(28px,5vw,43px) Georgia,serif;margin:20px 0 8px}p{color:#657a83;line-height:1.55}.viewer{background:white;border:1px solid #dbe6e4;border-radius:20px;padding:14px;box-shadow:0 12px 35px #1a465317;margin-top:22px}.viewer img{width:100%;height:auto;display:block;border-radius:10px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px}.actions a{background:#0c6678;color:white;border-radius:12px;padding:13px 19px;text-decoration:none;font-weight:800}.notice{background:#fff5e5;color:#79571d;padding:18px;border-radius:14px;margin-top:24px}small{color:#72848b}</style></head><body><div class="top"><a href="/">⌁ VisitaLoja.com</a></div><main class="wrap"><h1 id="title">Menú digital</h1><p id="description">Consulta nuestro menú actualizado.</p><div id="viewer" class="viewer"><div class="notice">Cargando imagen…</div></div><div class="actions" id="actions"></div><small>Contenido publicado por el establecimiento. Consulta disponibilidad y precios directamente con el negocio.</small></main><script>
(function(){const p=new URLSearchParams(location.search),url=p.get('image')||'',title=(p.get('title')||'Menú digital').slice(0,110),desc=(p.get('description')||'Consulta nuestro menú actualizado.').slice(0,250),viewer=document.getElementById('viewer');document.getElementById('title').textContent=title;document.getElementById('description').textContent=desc;document.title=title+' | VisitaLoja.com';let parsed;try{parsed=new URL(url);if(parsed.protocol!=='https:'||parsed.username||parsed.password||!['res.cloudinary.com','images.unsplash.com'].includes(parsed.hostname))throw Error('unsupported');}catch(_){viewer.innerHTML='<div class="notice">Este menú no está disponible. Solicita al establecimiento que revise la imagen publicada.</div>';return;}const img=document.createElement('img');img.alt='Imagen del menú: '+title;img.loading='eager';img.referrerPolicy='no-referrer';img.onerror=()=>{viewer.innerHTML='<div class="notice">No se pudo cargar la imagen del menú. Inténtalo más tarde.</div>'};img.src=parsed.href;viewer.replaceChildren(img);const link=document.createElement('a');link.href=parsed.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='⤢ Abrir imagen en tamaño completo';document.getElementById('actions').appendChild(link)})();
</script></body></html>
