<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba de optimización de imágenes | Visita Loja</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
  <main class="max-w-4xl mx-auto p-4 sm:p-8">
    <section class="bg-slate-900 border border-white/10 rounded-3xl p-5 sm:p-7">
      <p class="text-cyan-300 text-xs font-black tracking-widest">LABORATORIO · NO PRODUCCIÓN</p>
      <h1 class="text-3xl font-black mt-1">Optimización de imágenes</h1>
      <p class="text-slate-400 mt-2">Esta pantalla solo comprime la foto dentro de tu navegador. No la sube a Firebase, Cloudinary ni Firestore.</p>

      <label class="block mt-7">
        <span class="text-sm text-slate-300">Selecciona una foto JPG, PNG o WebP</span>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp" class="mt-2 block w-full text-sm">
      </label>

      <div id="status" class="mt-5 text-sm text-slate-400">Esperando una imagen…</div>

      <div id="result" class="hidden mt-7 space-y-5">
        <div class="grid sm:grid-cols-3 gap-3">
          <div class="bg-slate-950 rounded-2xl p-4"><div class="text-xs text-slate-500">Original</div><div id="originalSize" class="text-xl font-black mt-1"></div></div>
          <div class="bg-slate-950 rounded-2xl p-4"><div class="text-xs text-slate-500">Optimizada</div><div id="optimizedSize" class="text-xl font-black mt-1"></div></div>
          <div class="bg-slate-950 rounded-2xl p-4"><div class="text-xs text-slate-500">Ahorro</div><div id="savings" class="text-xl font-black mt-1"></div></div>
        </div>
        <div class="grid md:grid-cols-2 gap-5">
          <div><h2 class="font-bold mb-2">Original</h2><img id="originalPreview" class="w-full max-h-96 object-contain bg-black/30 rounded-2xl" alt="Imagen original"></div>
          <div><h2 class="font-bold mb-2">WebP optimizada</h2><img id="optimizedPreview" class="w-full max-h-96 object-contain bg-black/30 rounded-2xl" alt="Imagen optimizada"><p id="dimensions" class="text-xs text-slate-500 mt-2"></p></div>
        </div>
      </div>
    </section>
  </main>
  <script src="js/image-compressor.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    let originalUrl = '', optimizedUrl = '';
    const formatBytes = bytes => bytes < 1024 * 1024 ? (bytes / 1024).toFixed(0) + ' KB' : (bytes / 1024 / 1024).toFixed(2) + ' MB';

    $('file').addEventListener('change', async event => {
      const file = event.target.files[0];
      if (!file) return;
      $('result').classList.add('hidden');
      $('status').className = 'mt-5 text-sm text-cyan-300';
      $('status').textContent = 'Optimizando localmente…';
      try {
        const result = await window.VisitaLojaImageCompressor.compressImageClientSide(file);
        if (originalUrl) URL.revokeObjectURL(originalUrl);
        if (optimizedUrl) URL.revokeObjectURL(optimizedUrl);
        originalUrl = URL.createObjectURL(file);
        optimizedUrl = URL.createObjectURL(result.blob);
        $('originalPreview').src = originalUrl;
        $('optimizedPreview').src = optimizedUrl;
        $('originalSize').textContent = formatBytes(result.originalBytes);
        $('optimizedSize').textContent = formatBytes(result.optimizedBytes);
        $('savings').textContent = result.savingsPercent + '%';
        $('dimensions').textContent = result.width + ' × ' + result.height + ' px · ' + result.mimeType;
        $('result').classList.remove('hidden');
        $('status').className = 'mt-5 text-sm text-emerald-300';
        $('status').textContent = 'Optimización completada. Nada fue subido a Internet.';
      } catch (error) {
        $('status').className = 'mt-5 text-sm text-red-300';
        $('status').textContent = error.message || 'No se pudo optimizar la imagen.';
      }
    });
  </script>
</body>
</html>
