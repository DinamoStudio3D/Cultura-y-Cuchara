<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Rutas turísticas | Administración</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script><style>body{background:radial-gradient(circle at 10% 0,#3a1b08 0,transparent 28%),#07090c}.card{background:#10151d;border:1px solid #263142}.field{width:100%;background:#0b111a;border:1px solid #334155;border-radius:.75rem;padding:.75rem;color:white}.stop{touch-action:none}</style></head><body class="text-white min-h-screen"><header class="sticky top-0 z-40 bg-black/80 backdrop-blur border-b border-white/10"><div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center"><div><p class="text-orange-400 text-[10px] font-black tracking-widest">VISITA LOJA · ADMIN</p><h1 class="font-black text-lg">Rutas turísticas</h1></div><div class="flex gap-2"><a href="admin.html" class="border border-white/20 rounded-xl px-3 py-2 text-sm">Panel</a><a href="rutas.html" target="_blank" class="bg-orange-600 rounded-xl px-3 py-2 text-sm font-black">Vista pública</a></div></div></header><main class="max-w-6xl mx-auto p-4 pb-16"><section id="authBox" class="card max-w-md mx-auto mt-10 rounded-3xl p-6"><h2 class="text-2xl font-black">Acceso administrativo</h2><p class="text-slate-400 text-sm mt-2">Usa la misma cuenta autorizada del panel.</p><form id="login" class="space-y-3 mt-5"><input id="email" type="email" class="field" placeholder="Correo" required><input id="password" type="password" class="field" placeholder="Contraseña" required><button class="w-full bg-orange-500 text-black rounded-xl py-3 font-black">Ingresar</button></form><p id="authMsg" class="text-sm text-red-300 mt-3"></p></section><section id="app" class="hidden"><div class="grid lg:grid-cols-[360px_1fr] gap-5"><aside class="card rounded-3xl p-5 h-fit lg:sticky lg:top-20"><div class="flex justify-between items-center"><div><p class="text-orange-400 text-xs font-black">EDITOR</p><h2 id="formTitle" class="text-xl font-black">Nueva ruta</h2></div><button onclick="resetForm()" class="border border-white/20 rounded-xl px-3 py-2 text-sm"><i class="fa-solid fa-plus"></i></button></div><div class="space-y-3 mt-5"><input id="routeId" type="hidden"><label class="block text-sm">Nombre<input id="name" class="field mt-1" maxlength="100" placeholder="Ruta Cafetera Lojana"></label><div class="grid grid-cols-2 gap-2"><label class="text-sm">Categoría<input id="category" class="field mt-1" maxlength="50" placeholder="Gastronomía"></label><label class="text-sm">Duración<input id="duration" class="field mt-1" maxlength="40" placeholder="2 h 30 min"></label></div><label class="block text-sm">Descripción<textarea id="description" class="field mt-1 min-h-24" maxlength="300"></textarea></label><label class="block text-sm">Imagen de portada<input id="image" class="field mt-1" type="url" placeholder="https://..."></label><label class="flex items-center gap-3 bg-black/30 rounded-xl p-3"><input id="active" type="checkbox" checked class="w-5 h-5 accent-orange-500"><span><b class="block text-sm">Ruta publicada</b><small class="text-slate-400">Visible para turistas</small></span></label><button onclick="saveRoute()" class="w-full bg-orange-500 hover:bg-orange-400 text-black rounded-xl py-3 font-black"><i class="fa-solid fa-floppy-disk mr-1"></i>Guardar ruta</button></div></aside><section class="space-y-5"><div class="card rounded-3xl p-5"><div class="flex flex-col sm:flex-row sm:items-end justify-between gap-3"><div><p class="text-cyan-300 text-xs font-black">PARADAS</p><h2 class="text-xl font-black">Construye el recorrido</h2><p class="text-slate-400 text-sm mt-1">Agrega paradas y ordénalas. Se guardan por ID real.</p></div><input id="search" class="field sm:max-w-xs" placeholder="Buscar parada…" oninput="renderPlaces()"></div><div id="selected" class="space-y-2 mt-5"></div><div class="border-t border-white/10 mt-5 pt-5"><p class="text-xs text-slate-400 mb-2">Agregar parada</p><div id="places" class="grid sm:grid-cols-2 gap-2 max-h-72 overflow-y-auto"></div></div></div><div class="card rounded-3xl p-5"><div class="flex justify-between items-center"><div><p class="text-emerald-300 text-xs font-black">RUTAS GUARDADAS</p><h2 class="text-xl font-black">Publicadas y borradores</h2></div><span id="count" class="text-sm text-slate-400"></span></div><div id="routeList" class="space-y-3 mt-4"></div></div></section></div></section></main><script>const firebaseConfig={apiKey:'AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE',authDomain:'cultura-y-cuchara.firebaseapp.com',projectId:'cultura-y-cuchara',storageBucket:'cultura-y-cuchara.firebasestorage.app',messagingSenderId:'974351327730',appId:'1:974351327730:web:08573026a46d1bb6598b6b'};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let allRoutes=[],allPlaces=[],selectedIds=[];const esc=(v='')=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));auth.onAuthStateChanged(async u=>{if(!u){authBox.classList.remove('hidden');app.classList.add('hidden');return}try{const p=await db.collection('adminUsers').doc(u.uid).get();const ok=(p.exists&&p.data().active===true&&['admin','owner'].includes(p.data().role))||u.email==='sukogames1996@gmail.com';if(!ok)throw Error('Cuenta sin permisos administrativos.');authBox.classList.add('hidden');app.classList.remove('hidden');await load()}catch(e){authMsg.textContent=e.message;await auth.signOut()}});login.onsubmit=async e=>{e.preventDefault();authMsg.textContent='';try{await auth.signInWithEmailAndPassword(email.value,password.value)}catch(err){authMsg.textContent='No se pudo iniciar sesión.'}};async function load(){const [cfg,locs]=await Promise.all([db.collection('settings').doc('touristRoutes').get(),db.collection('locales').get()]);allRoutes=cfg.exists&&Array.isArray(cfg.data().routes)?cfg.data().routes:[];allPlaces=locs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));renderAll()}function renderAll(){renderSelected();renderPlaces();renderRoutes()}function renderSelected(){selected.innerHTML=selectedIds.length?selectedIds.map((id,i)=>{const p=allPlaces.find(x=>x.id===id);return `<div class="stop flex items-center gap-2 bg-black/30 border border-white/10 rounded-xl p-2"><span class="w-8 h-8 rounded-full bg-orange-500 text-black grid place-items-center font-black">${i+1}</span><div class="min-w-0 flex-1"><b class="text-sm">${esc(p?.name||id)}</b><small class="block text-slate-500 truncate">ID: ${esc(id)}</small></div><button onclick="move(${i},-1)" class="w-9 h-9 border rounded-lg">↑</button><button onclick="move(${i},1)" class="w-9 h-9 border rounded-lg">↓</button><button onclick="removeStop(${i})" class="w-9 h-9 text-red-400">×</button></div>`}).join(''):'<div class="text-sm text-slate-500 border border-dashed border-slate-700 rounded-xl p-4">Todavía no agregaste paradas.</div>'}function renderPlaces(){const q=search.value.toLowerCase().trim();places.innerHTML=allPlaces.filter(p=>!selectedIds.includes(p.id)&&(!q||(p.name||'').toLowerCase().includes(q))).slice(0,100).map(p=>`<button onclick="addStop('${encodeURIComponent(p.id)}')" class="text-left bg-black/25 hover:bg-orange-500/10 border border-white/10 rounded-xl p-3"><b class="text-sm">${esc(p.name||'Sin nombre')}</b><small class="block text-slate-500">${esc(p.category||'Parada')}</small></button>`).join('')}function addStop(id){id=decodeURIComponent(id);if(!selectedIds.includes(id))selectedIds.push(id);renderAll()}function removeStop(i){selectedIds.splice(i,1);renderAll()}function move(i,d){const j=i+d;if(j<0||j>=selectedIds.length)return;[selectedIds[i],selectedIds[j]]=[selectedIds[j],selectedIds[i]];renderSelected()}function resetForm(){routeId.value='';name.value='';category.value='';duration.value='';description.value='';image.value='';active.checked=true;selectedIds=[];formTitle.textContent='Nueva ruta';renderAll()}function editRoute(id){const r=allRoutes.find(x=>x.id===id);if(!r)return;routeId.value=r.id;name.value=r.name||'';category.value=r.category||'';duration.value=r.duration||'';description.value=r.description||'';image.value=r.image||'';active.checked=r.active!==false;selectedIds=(r.placeIds||[]).filter(id=>allPlaces.some(p=>p.id===id));formTitle.textContent='Editar ruta';renderAll();scrollTo({top:0,behavior:'smooth'})}async function saveRoute(){const n=name.value.trim();if(!n)return alert('Escribe el nombre de la ruta.');if(selectedIds.length<2)return alert('Una ruta debe tener al menos 2 paradas.');const id=routeId.value||('route-'+Date.now());const item={id,name:n,category:category.value.trim()||'General',duration:duration.value.trim(),description:description.value.trim(),image:image.value.trim(),active:active.checked,placeIds:[...selectedIds]};const idx=allRoutes.findIndex(r=>r.id===id);if(idx>=0)allRoutes[idx]=item;else allRoutes.push(item);await persist();resetForm()}async function deleteRoute(id){if(!confirm('¿Eliminar esta ruta?'))return;allRoutes=allRoutes.filter(r=>r.id!==id);await persist();resetForm()}async function persist(){await db.collection('settings').doc('touristRoutes').set({routes:allRoutes,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.uid},{merge:true});renderRoutes()}function renderRoutes(){count.textContent=allRoutes.length+' rutas';routeList.innerHTML=allRoutes.length?allRoutes.map(r=>`<article class="bg-black/30 border border-white/10 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center gap-3"><div class="flex-1 min-w-0"><div class="flex gap-2 items-center"><b>${esc(r.name)}</b><span class="text-[10px] rounded-full px-2 py-1 ${r.active!==false?'bg-emerald-500/15 text-emerald-300':'bg-slate-700 text-slate-300'}">${r.active!==false?'PUBLICADA':'BORRADOR'}</span></div><p class="text-xs text-slate-400 mt-1">${esc(r.category||'General')} · ${(r.placeIds||[]).length} paradas ${r.duration?'· '+esc(r.duration):''}</p></div><div class="flex gap-2"><button onclick="editRoute('${r.id}')" class="border border-cyan-500/30 text-cyan-200 rounded-xl px-3 py-2 text-sm">Editar</button><button onclick="deleteRoute('${r.id}')" class="border border-red-500/30 text-red-300 rounded-xl px-3 py-2 text-sm">Eliminar</button></div></article>`).join(''):'<p class="text-slate-500">Aún no hay rutas creadas.</p>'}</script></body></html>
