<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi negocio | Visita Loja</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script></head>
<body class="min-h-screen bg-slate-950 text-white"><main class="max-w-3xl mx-auto p-4 sm:p-8"><a href="../merchant-dashboard.html" class="text-cyan-300">← Volver al panel</a><section class="mt-5 bg-slate-900 border border-white/10 rounded-3xl p-5 sm:p-7"><p class="text-cyan-300 text-xs font-black tracking-widest">AUTOGESTIÓN</p><h1 class="text-3xl font-black mt-1">Mi negocio</h1><p class="text-slate-400 mt-2">Edita únicamente la información pública permitida de tus paradas.</p><div id="loading" class="mt-8 text-slate-400">Comprobando acceso…</div><div id="login" class="hidden mt-8"><button id="google" class="w-full bg-white text-slate-950 rounded-xl p-3 font-black">Ingresar con Google</button><p id="loginError" class="hidden mt-4 text-sm text-red-300"></p></div><div id="denied" class="hidden mt-8 text-amber-300"><p>Esta cuenta no tiene paradas autorizadas.</p><button id="deniedLogout" class="mt-4 border border-white/20 rounded-xl px-4 py-2">Cambiar cuenta</button></div><form id="form" class="hidden mt-7 space-y-5"><label class="block"><span class="text-sm text-slate-300">Parada</span><select id="place" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></select></label><label class="block"><span class="text-sm text-slate-300">Descripción</span><textarea id="description" maxlength="1200" rows="6" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></textarea></label><div class="grid sm:grid-cols-2 gap-4"><label><span class="text-sm text-slate-300">Teléfono</span><input id="phone" maxlength="30" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label><label><span class="text-sm text-slate-300">WhatsApp</span><input id="whatsapp" maxlength="30" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label></div><label class="block"><span class="text-sm text-slate-300">Horarios</span><textarea id="hours" maxlength="600" rows="4" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3" placeholder="Ej. Lun–Vie 08:00–20:00"></textarea></label>
<section class="border-t border-white/10 pt-5 space-y-5"><div><h2 class="text-xl font-black">Imágenes</h2><p class="text-sm text-slate-400 mt-1">JPG, PNG o WebP. Máximo 5 MB por archivo. La galería admite hasta 6 fotos.</p></div><div class="grid sm:grid-cols-2 gap-4"><label class="block"><span class="text-sm text-slate-300">Logo</span><input id="logoFile" type="file" accept="image/jpeg,image/png,image/webp" class="mt-2 block w-full text-sm"><img id="logoPreview" class="hidden mt-3 w-28 h-28 rounded-2xl object-contain bg-white p-2" alt="Vista previa del logo"></label><label class="block"><span class="text-sm text-slate-300">Imagen de portada</span><input id="heroFile" type="file" accept="image/jpeg,image/png,image/webp" class="mt-2 block w-full text-sm"><img id="heroPreview" class="hidden mt-3 w-full h-32 rounded-2xl object-cover" alt="Vista previa de portada"></label></div><label class="block"><span class="text-sm text-slate-300">Añadir fotos a la galería</span><input id="galleryFiles" type="file" multiple accept="image/jpeg,image/png,image/webp" class="mt-2 block w-full text-sm"></label><div id="galleryPreview" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div></section>
<div class="flex gap-3"><button id="save" class="bg-cyan-400 text-cyan-950 rounded-xl px-5 py-3 font-black">Guardar cambios</button><button type="button" id="logout" class="border border-white/20 rounded-xl px-5 py-3">Salir</button></div><p id="message" class="text-sm"></p></form></section></main>
<script>
const firebaseConfig={apiKey:"AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE",authDomain:"cultura-y-cuchara.firebaseapp.com",projectId:"cultura-y-cuchara",storageBucket:"cultura-y-cuchara.firebasestorage.app",messagingSenderId:"974351327730",appId:"1:974351327730:web:08573026a46d1bb6598b6b"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),storage=firebase.storage(),$=id=>document.getElementById(id);let merchant=null,places=[];
function show(id){['loading','login','denied','form'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function value(data,names){for(const name of names){if(typeof data[name]==='string')return data[name]}return''}
function imageUrl(x){return typeof x==='string'?x:(x&&typeof x.img==='string'?x.img:'')}
function renderImages(p){const logo=value(p,['customLogoUrl']),hero=value(p,['heroImage','image']),gallery=Array.isArray(p.gallery)?p.gallery.slice(0,6):[];$('logoPreview').src=logo;$('logoPreview').classList.toggle('hidden',!logo);$('heroPreview').src=hero;$('heroPreview').classList.toggle('hidden',!hero);$('galleryPreview').innerHTML=gallery.map((x,i)=>{const url=imageUrl(x);return url?'<div class="relative"><img src="'+url.replace(/"/g,'&quot;')+'" class="w-full h-28 object-cover rounded-xl" alt="Foto '+(i+1)+'"><button type="button" data-remove-gallery="'+i+'" class="absolute top-1 right-1 bg-black/70 rounded-full w-8 h-8">×</button></div>':''}).join('');$('galleryPreview').querySelectorAll('[data-remove-gallery]').forEach(b=>b.onclick=()=>{const p=places.find(x=>x.id===$('place').value);p.gallery.splice(Number(b.dataset.removeGallery),1);renderImages(p)})}
function loadPlace(){const p=places.find(x=>x.id===$('place').value);if(!p)return;$('description').value=value(p,['desc','description','descripcion']);$('phone').value=value(p,['phone','telefono','tel']);$('whatsapp').value=value(p,['whatsapp','whatsApp']);$('hours').value=value(p,['hours','horarios','schedule']);$('logoFile').value='';$('heroFile').value='';$('galleryFiles').value='';renderImages(p)}
async function load(){const ids=(merchant.placeIds||[]).slice(0,20),docs=await Promise.all(ids.map(id=>db.collection('locales').doc(id).get()));places=docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));if(!places.length){show('denied');return}$('place').innerHTML=places.map(p=>'<option value="'+p.id.replace(/"/g,'&quot;')+'">'+String(p.title||p.name||p.id).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</option>').join('');show('form');loadPlace()}
function validateFile(file){if(!file)return;const ok=['image/jpeg','image/png','image/webp'];if(!ok.includes(file.type))throw new Error('Solo se permiten imágenes JPG, PNG o WebP.');if(file.size>5*1024*1024)throw new Error('Cada imagen debe pesar máximo 5 MB.')}
function safeExt(file){return file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'}
async function uploadImage(file,placeId,slot){validateFile(file);const path='merchants/'+auth.currentUser.uid+'/'+placeId+'/'+slot+'-'+Date.now()+'.'+safeExt(file),ref=storage.ref(path);await ref.put(file,{contentType:file.type});return await ref.getDownloadURL()}
$('logoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;try{validateFile(f);$('logoPreview').src=URL.createObjectURL(f);$('logoPreview').classList.remove('hidden')}catch(err){e.target.value='';alert(err.message)}};$('heroFile').onchange=e=>{const f=e.target.files[0];if(!f)return;try{validateFile(f);$('heroPreview').src=URL.createObjectURL(f);$('heroPreview').classList.remove('hidden')}catch(err){e.target.value='';alert(err.message)}};
$('place').onchange=loadPlace;$('form').onsubmit=async e=>{e.preventDefault();const id=$('place').value,p=places.find(x=>x.id===id);if(!p||!merchant.placeIds.includes(id))return;const save=$('save'),message=$('message'),desc=$('description').value.trim(),logoFile=$('logoFile').files[0],heroFile=$('heroFile').files[0],newGallery=[...$('galleryFiles').files];save.disabled=true;message.className='text-sm text-slate-300';message.textContent='Guardando…';try{newGallery.forEach(validateFile);if((Array.isArray(p.gallery)?p.gallery.length:0)+newGallery.length>6)throw new Error('La galería admite máximo 6 fotos.');let customLogoUrl=value(p,['customLogoUrl']),heroImage=value(p,['heroImage']),gallery=Array.isArray(p.gallery)?p.gallery.slice(0,6):[];if(logoFile){message.textContent='Subiendo logo…';customLogoUrl=await uploadImage(logoFile,id,'logo')}if(heroFile){message.textContent='Subiendo portada…';heroImage=await uploadImage(heroFile,id,'hero')}for(let i=0;i<newGallery.length;i++){message.textContent='Subiendo foto '+(i+1)+' de '+newGallery.length+'…';gallery.push({img:await uploadImage(newGallery[i],id,'gallery-'+(gallery.length+1)),title:''})}message.textContent='Guardando información…';await db.collection('locales').doc(id).update({desc,phone:$('phone').value.trim(),whatsapp:$('whatsapp').value.trim(),hours:$('hours').value.trim(),customLogoUrl,heroImage,gallery,merchantUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),merchantUpdatedBy:auth.currentUser.uid});Object.assign(p,{desc,phone:$('phone').value.trim(),whatsapp:$('whatsapp').value.trim(),hours:$('hours').value.trim(),customLogoUrl,heroImage,gallery});$('logoFile').value='';$('heroFile').value='';$('galleryFiles').value='';renderImages(p);message.className='text-sm text-emerald-300';message.textContent='Cambios guardados correctamente.'}catch(err){message.className='text-sm text-red-300';message.textContent='No se pudo guardar: '+(err.message||err.code||'error desconocido')}finally{save.disabled=false}};
auth.onAuthStateChanged(async user=>{if(!user){show('login');return}try{const d=await db.collection('missionRewardMerchants').doc(user.uid).get();if(!d.exists||d.data().active!==true||!(d.data().placeIds||[]).length){show('denied');return}merchant={id:user.uid,...d.data()};await load()}catch(err){show('denied');console.error(err)}});const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});$('google').onclick=async()=>{const b=$('google'),err=$('loginError');b.disabled=true;b.textContent='Abriendo Google…';err.classList.add('hidden');try{await auth.signInWithPopup(provider)}catch(e){b.disabled=false;b.textContent='Ingresar con Google';if(e.code==='auth/popup-closed-by-user')return;err.textContent='No se pudo iniciar sesión: '+(e.message||e.code||'error desconocido');err.classList.remove('hidden')}};$('logout').onclick=()=>auth.signOut();$('deniedLogout').onclick=()=>auth.signOut();
</script></body></html>
