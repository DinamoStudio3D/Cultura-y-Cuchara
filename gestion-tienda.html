<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tienda | Administración Visita Loja</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script><style>body{background:#080b0a}.card{background:#101513;border:1px solid rgba(255,255,255,.1)}.field{width:100%;background:#080b0a;border:1px solid rgba(255,255,255,.14);border-radius:.75rem;padding:.75rem;outline:none}.field:focus{border-color:#f97316}</style></head>
<body class="text-white min-h-screen"><header class="border-b border-white/10 sticky top-0 bg-[#080b0a]/95 z-20"><div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"><div><p class="text-orange-300 text-xs font-black tracking-widest">ADMINISTRACIÓN</p><h1 class="text-xl font-black">Tienda Visita Loja</h1></div><div class="flex gap-2"><a href="tienda.html" target="_blank" class="border border-orange-500/30 text-orange-200 rounded-xl px-3 py-2 text-sm">Ver tienda</a><a href="admin.html" class="border border-white/15 rounded-xl px-3 py-2 text-sm">Panel</a><button id="logout" class="border border-red-500/30 text-red-200 rounded-xl px-3"><i class="fa-solid fa-right-from-bracket"></i></button></div></div></header>
<main class="max-w-7xl mx-auto p-4 py-8"><section id="login" class="card max-w-md mx-auto rounded-3xl p-6"><h2 class="text-2xl font-black">Acceso administrativo</h2><form id="loginForm" class="space-y-4 mt-5"><input id="email" type="email" class="field" placeholder="Correo" required><input id="password" type="password" class="field" placeholder="Contraseña" required><button class="w-full bg-orange-500 rounded-xl py-3 font-black">Ingresar</button><p id="loginMsg" class="text-red-300 text-sm"></p></form></section>
<div id="app" class="hidden space-y-6"><section class="grid lg:grid-cols-[.75fr_1.25fr] gap-6"><div class="space-y-6"><section class="card rounded-3xl p-5"><div class="flex justify-between"><div><p class="text-orange-300 text-xs font-black tracking-widest">CATÁLOGO</p><h2 class="text-xl font-black">Producto</h2></div><button id="reset" class="border border-white/15 rounded-xl px-3 text-sm">Nuevo</button></div><form id="productForm" class="space-y-3 mt-5"><input id="productId" type="hidden"><label class="block"><span class="text-sm font-bold">Nombre *</span><input id="name" class="field mt-1" maxlength="100" required></label><label class="block"><span class="text-sm font-bold">Nombre en inglés</span><input id="nameEn" class="field mt-1" maxlength="100"></label><label class="block"><span class="text-sm font-bold">Descripción</span><textarea id="description" class="field mt-1 min-h-20" maxlength="500"></textarea></label><label class="block"><span class="text-sm font-bold">Descripción en inglés</span><textarea id="descriptionEn" class="field mt-1 min-h-20" maxlength="500"></textarea></label><div class="grid grid-cols-2 gap-3"><label><span class="text-sm font-bold">Precio USD *</span><input id="price" type="number" min="0" step=".01" class="field mt-1" required></label><label><span class="text-sm font-bold">Stock *</span><input id="stock" type="number" min="0" step="1" class="field mt-1" required></label></div><label class="block"><span class="text-sm font-bold">Categoría</span><select id="category" class="field mt-1"><option value="merch">Merch</option><option value="souvenirs">Recuerdos</option><option value="crafts">Artesanías</option><option value="food">Sabores</option><option value="other">Otros</option></select></label><label class="block"><span class="text-sm font-bold">URL de imagen</span><input id="image" type="url" class="field mt-1" placeholder="https://..."></label><label class="block"><span class="text-sm font-bold">Variantes</span><input id="variants" class="field mt-1" placeholder="S, M, L o Rojo, Azul"><small class="text-gray-500">Separadas por comas.</small></label><div class="grid grid-cols-2 gap-3"><label class="flex gap-2 items-center"><input id="active" type="checkbox" checked> Visible</label><label class="flex gap-2 items-center"><input id="featured" type="checkbox"> Destacado</label></div><button class="w-full bg-orange-500 rounded-xl py-3 font-black">Guardar producto</button><p id="productMsg" class="text-sm"></p></form></section>
<section class="card rounded-3xl p-5"><p class="text-emerald-300 text-xs font-black tracking-widest">PEDIDOS</p><h2 class="text-xl font-black">Configuración</h2><form id="settingsForm" class="space-y-3 mt-4"><label class="block"><span class="text-sm font-bold">WhatsApp receptor *</span><input id="whatsapp" class="field mt-1" inputmode="numeric" placeholder="593999999999" required></label><label class="block"><span class="text-sm font-bold">Punto de retiro</span><textarea id="pickupAddress" class="field mt-1 min-h-20"></textarea></label><button class="w-full bg-emerald-500 text-emerald-950 rounded-xl py-3 font-black">Guardar configuración</button><p id="settingsMsg" class="text-sm"></p></form></section></div>
<section class="card rounded-3xl p-5"><div class="flex flex-col sm:flex-row justify-between gap-3"><div><p class="text-cyan-300 text-xs font-black tracking-widest">INVENTARIO</p><h2 class="text-xl font-black">Productos publicados</h2></div><input id="search" oninput="render()" class="field max-w-xs" placeholder="Buscar producto"></div><div id="stats" class="grid grid-cols-3 gap-3 mt-5"></div><div id="list" class="grid md:grid-cols-2 gap-4 mt-5"></div></section></section></div></main>
<script>
const firebaseConfig={apiKey:"AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE",authDomain:"cultura-y-cuchara.firebaseapp.com",projectId:"cultura-y-cuchara",storageBucket:"cultura-y-cuchara.firebasestorage.app",messagingSenderId:"974351327730",appId:"1:974351327730:web:08573026a46d1bb6598b6b"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),ADMIN='sukogames1996@gmail.com';let products=[];
const el=id=>document.getElementById(id),safe=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'$'+Number(v||0).toFixed(2);
auth.onAuthStateChanged(u=>{const ok=u&&u.email===ADMIN;el('login').classList.toggle('hidden',ok);el('app').classList.toggle('hidden',!ok);if(ok)load()});el('loginForm').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(el('email').value.trim(),el('password').value)}catch(_){el('loginMsg').textContent='Correo o contraseña incorrectos.'}};el('logout').onclick=()=>auth.signOut();
async function load(){const [p,s]=await Promise.all([db.collection('storeProducts').get(),db.collection('siteContent').doc('store').get()]);products=p.docs.map(d=>({id:d.id,...d.data()}));if(s.exists){el('whatsapp').value=s.data().whatsapp||'';el('pickupAddress').value=s.data().pickupAddress||''}render()}
function render(){const q=el('search').value.toLowerCase(),list=products.filter(x=>!q||[x.name,x.nameEn,x.category].some(v=>String(v||'').toLowerCase().includes(q)));el('stats').innerHTML='<div class="bg-white/5 rounded-xl p-3"><b class="text-2xl text-cyan-300">'+products.length+'</b><span class="block text-xs text-gray-500">Productos</span></div><div class="bg-white/5 rounded-xl p-3"><b class="text-2xl text-emerald-300">'+products.filter(x=>x.active).length+'</b><span class="block text-xs text-gray-500">Visibles</span></div><div class="bg-white/5 rounded-xl p-3"><b class="text-2xl text-orange-300">'+products.reduce((s,x)=>s+Number(x.stock||0),0)+'</b><span class="block text-xs text-gray-500">Unidades</span></div>';el('list').innerHTML=list.length?list.map(x=>'<article class="bg-black/20 border border-white/10 rounded-2xl overflow-hidden"><div class="aspect-[16/9] bg-white/5">'+(x.image?'<img src="'+safe(x.image)+'" class="w-full h-full object-cover">':'')+'</div><div class="p-4"><div class="flex justify-between gap-3"><div><b>'+safe(x.name)+'</b><p class="text-xs text-gray-500">'+safe(x.category)+'</p></div><span class="text-xs '+(x.active?'text-emerald-300':'text-red-300')+'">'+(x.active?'Visible':'Oculto')+'</span></div><p class="mt-3"><b class="text-orange-300">'+money(x.price)+'</b> · Stock '+Number(x.stock||0)+'</p><div class="flex gap-2 mt-3"><button onclick="editProduct(\''+safe(x.id)+'\')" class="border border-white/15 rounded-lg px-3 py-2 text-xs">Editar</button><button onclick="toggleProduct(\''+safe(x.id)+'\','+!x.active+')" class="border border-amber-500/25 text-amber-200 rounded-lg px-3 py-2 text-xs">'+(x.active?'Ocultar':'Publicar')+'</button><button onclick="deleteProduct(\''+safe(x.id)+'\')" class="ml-auto border border-red-500/25 text-red-200 rounded-lg px-3 py-2 text-xs">Eliminar</button></div></div></article>').join(''):'<p class="text-gray-500">No existen productos.</p>'}
el('productForm').onsubmit=async e=>{e.preventDefault();const id=el('productId').value||db.collection('storeProducts').doc().id,data={name:el('name').value.trim(),nameEn:el('nameEn').value.trim(),description:el('description').value.trim(),descriptionEn:el('descriptionEn').value.trim(),price:Number(el('price').value),stock:Number(el('stock').value),category:el('category').value,image:el('image').value.trim(),variants:el('variants').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,20),active:el('active').checked,featured:el('featured').checked,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email};await db.collection('storeProducts').doc(id).set(data,{merge:true});el('productMsg').textContent='Producto guardado correctamente.';resetForm();await load()};
function editProduct(id){const x=products.find(p=>p.id===id);if(!x)return;['name','nameEn','description','descriptionEn','price','stock','category','image'].forEach(k=>el(k).value=x[k]??'');el('variants').value=(x.variants||[]).join(', ');el('active').checked=x.active!==false;el('featured').checked=!!x.featured;el('productId').value=id;scrollTo({top:0,behavior:'smooth'})}
function resetForm(){el('productForm').reset();el('productId').value='';el('active').checked=true;el('productMsg').textContent=''}el('reset').onclick=resetForm;
async function toggleProduct(id,active){await db.collection('storeProducts').doc(id).update({active,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email});await load()}
async function deleteProduct(id){if(!confirm('¿Eliminar este producto definitivamente?'))return;await db.collection('storeProducts').doc(id).delete();await load()}
el('settingsForm').onsubmit=async e=>{e.preventDefault();const whatsapp=el('whatsapp').value.replace(/\D/g,'');if(whatsapp.length<10){el('settingsMsg').textContent='Escribe el número con código de país.';return}await db.collection('siteContent').doc('store').set({whatsapp,pickupAddress:el('pickupAddress').value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.email},{merge:true});el('settingsMsg').textContent='Configuración guardada correctamente.'};
</script></body></html>
