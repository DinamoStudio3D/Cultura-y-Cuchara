<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Registrar visita | Visita Loja</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-functions-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script><style>body{background:radial-gradient(circle at 10% 0,rgba(20,184,166,.2),transparent 35rem),#07100e}.card{background:linear-gradient(145deg,rgba(16,31,28,.98),rgba(7,16,14,.98));border:1px solid rgba(255,255,255,.1)}button,a{touch-action:manipulation;min-height:44px}</style></head><body class="min-h-screen text-white antialiased"><header class="border-b border-white/10"><div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center"><div><p class="text-emerald-400 text-xs font-black tracking-widest">VISITA LOJA</p><h1 class="font-black text-xl">Registrar visita</h1></div><a href="./" class="border border-white/15 rounded-xl px-3 py-2 text-sm">Volver</a></div></header><main class="max-w-xl mx-auto px-4 py-8"><section id="login" class="card rounded-3xl p-7"><span class="w-14 h-14 rounded-2xl bg-emerald-500/15 text-emerald-300 grid place-items-center text-2xl"><i class="fa-solid fa-location-dot"></i></span><p class="text-emerald-300 text-xs font-black tracking-widest mt-5">VISITA SIN ENCARGADO</p><h2 id="loginPlace" class="text-2xl font-black mt-1">Atractivo Visita Loja</h2><p class="text-gray-400 mt-3">Ingresa con tu cuenta para verificar que estás junto al atractivo y registrar tu visita.</p><button id="googleBtn" class="w-full bg-white text-gray-900 rounded-xl py-3 font-black mt-6"><i class="fa-brands fa-google mr-2"></i>Ingresar con Google</button></section><section id="ready" class="hidden card rounded-3xl p-7"><div id="connectionStatus" class="rounded-xl px-3 py-2 text-xs font-bold mb-4 bg-emerald-500/10 border border-emerald-400/25 text-emerald-200">Sistema listo para verificar la visita.</div><p class="text-emerald-300 text-xs font-black tracking-widest">VISITA PRESENCIAL</p><h2 id="placeName" class="text-2xl font-black mt-1">Atractivo Visita Loja</h2><p id="visitorName" class="text-gray-400 text-sm mt-2"></p><div id="placeProgress" class="hidden"></div><div id="generateBox" class="mt-6"></div><div id="codeBox" class="hidden"></div><div id="confirmed" class="hidden mt-6 bg-emerald-500/15 border border-emerald-500/30 rounded-2xl p-5 text-center"><i class="fa-solid fa-circle-check text-4xl text-emerald-300"></i><h3 id="confirmedTitle" class="text-xl font-black mt-3">¡Visita registrada!</h3><p id="confirmedText" class="text-gray-300 mt-2"></p><a href="./" class="inline-flex mt-4 bg-emerald-400 text-emerald-950 rounded-xl px-5 py-3 font-black">Continuar explorando</a></div><p id="message" class="text-sm mt-4"></p></section></main><script>const firebaseConfig={apiKey:"AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE",authDomain:"cultura-y-cuchara.firebaseapp.com",projectId:"cultura-y-cuchara",storageBucket:"cultura-y-cuchara.firebasestorage.app",messagingSenderId:"974351327730",appId:"1:974351327730:web:08573026a46d1bb6598b6b"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();const params=new URLSearchParams(location.search),placeId=(params.get('checkin')||'').trim();async function loadPlace(){if(!placeId)return;try{const s=await db.collection('locales').doc(placeId).get();if(s.exists){const d=s.data()||{},name=d.name||d.nombre||'Atractivo Visita Loja';document.getElementById('loginPlace').textContent=name;document.getElementById('placeName').textContent=name}}catch(_){}}document.getElementById('googleBtn').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){document.getElementById('message').textContent='No se pudo iniciar sesión: '+e.message}};auth.onAuthStateChanged(u=>{document.getElementById('login').classList.toggle('hidden',!!u);document.getElementById('ready').classList.toggle('hidden',!u);if(u)document.getElementById('visitorName').textContent=u.displayName||u.email||'Visitante'});loadPlace();</script><script src="js/self-checkin-client.js"></script></body></html>
