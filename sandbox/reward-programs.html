<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Beneficios · VisitaLoja</title><link rel="stylesheet" href="/css/admin-reward-programs.css"><style>body{margin:0;background:#edf3fb;color:#17324f;font:16px/1.6 system-ui}main{max-width:1120px;margin:auto;padding:20px}header h1{font-size:clamp(25px,5vw,38px)}[hidden]{display:none!important}.sandbox-nav{display:flex;gap:10px;flex-wrap:wrap}.sandbox-nav button{padding:12px 18px;border:1px solid #adc8e1;border-radius:12px;color:#0755a2;background:#fff;font:700 16px system-ui;cursor:pointer}.sandbox-nav button[aria-pressed=true]{background:#0755a2;color:white}button:focus-visible,input:focus-visible{outline:3px solid #d99c30;outline-offset:3px}</style></head>
<body><main><header><p>VISITALOJA · ENTORNO DE PRUEBAS</p><h1>Beneficios que invitan a volver</h1><p>Las tarjetas y premios de esta versión están separados de los de la web pública.</p></header>

<p id="workspaceStatus" role="status" aria-live="polite"></p><section id="customer"></section><section id="merchant" hidden></section><section id="editor" hidden></section><section id="publication" hidden></section>
</main><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="/js/popup-schedule.js"></script><script src="/js/reward-programs-model.js"></script><script src="/js/admin-reward-programs.js"></script><script src="/js/reward-programs-client.js"></script><script src="/js/reward-programs-portal.js"></script><script src="/sandbox/reward-programs-bootstrap.js"></script></body></html>
