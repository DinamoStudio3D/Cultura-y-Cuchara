<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010">
  <title>Estado de mi solicitud | Vive Loja</title>
  <script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:'#ea580c',gold:'#f59e0b',teal:'#14b8a6',ink:'#101010'}}}}</script>
  <style>body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,rgba(234,88,12,.2),transparent 30%),radial-gradient(circle at 85% 70%,rgba(20,184,166,.16),transparent 35%),#09090b}.field{width:100%;border:1px solid #3f3f46;background:#18181b;border-radius:.9rem;padding:.9rem 1rem;color:white;outline:none;text-transform:uppercase}.field:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.15)}</style>
</head>
<body class="min-h-screen text-white flex flex-col">
  <nav class="border-b border-white/10 bg-black/40"><div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center"><a href="index.html" class="font-black">VIVE <span class="text-brand">LOJA</span></a><a href="sumar-negocio.html" class="text-sm text-gray-300 hover:text-white">Nueva solicitud</a></div></nav>
  <main class="flex-1 grid place-items-center px-4 py-12"><section class="w-full max-w-xl bg-white/5 border border-white/10 rounded-3xl p-6 sm:p-9 shadow-2xl"><span class="w-14 h-14 rounded-2xl bg-teal/15 text-teal grid place-items-center text-2xl"><i class="fa-solid fa-magnifying-glass-location"></i></span><p class="text-teal text-xs font-black uppercase tracking-widest mt-6">Seguimiento privado</p><h1 class="text-3xl sm:text-4xl font-black mt-2">Consulta tu solicitud</h1><p class="text-gray-400 mt-3">Escribe exactamente el código que recibiste al enviar tus datos. Aquí nunca mostraremos información personal.</p><form id="statusForm" class="mt-7"><label><span class="text-sm font-bold block mb-2">Código de seguimiento</span><div class="flex flex-col sm:flex-row gap-3"><input id="trackingCode" class="field" required maxlength="20" placeholder="SOL-XXXXXXXXXX"><button id="statusButton" class="bg-teal text-ink rounded-xl px-6 py-3 font-black whitespace-nowrap">Consultar</button></div></label></form><div id="statusResult" class="hidden mt-6 rounded-2xl border p-5"></div><a href="index.html" class="inline-block mt-7 text-sm text-gray-400 hover:text-white"><i class="fa-solid fa-arrow-left mr-2"></i>Volver a Vive Loja</a></section></main>
  <script>
    const firebaseConfig={apiKey:"AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE",authDomain:"cultura-y-cuchara.firebaseapp.com",projectId:"cultura-y-cuchara",storageBucket:"cultura-y-cuchara.firebasestorage.app",messagingSenderId:"974351327730",appId:"1:974351327730:web:08573026a46d1bb6598b6b"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
    const states={pending:{icon:'fa-clock',title:'Solicitud recibida',text:'Tus datos llegaron correctamente y están pendientes de revisión.',tone:'border-amber-500/30 bg-amber-500/10 text-amber-100'},reviewing:{icon:'fa-magnifying-glass',title:'Estamos revisándola',text:'Estamos verificando la información y podremos contactarte para completar detalles.',tone:'border-sky-500/30 bg-sky-500/10 text-sky-100'},approved:{icon:'fa-circle-check',title:'Solicitud aprobada',text:'Tu negocio fue aprobado como parada. Nuestro equipo te contactará para los siguientes pasos.',tone:'border-emerald-500/30 bg-emerald-500/10 text-emerald-100'},rejected:{icon:'fa-circle-info',title:'Solicitud no aprobada',text:'Por ahora no fue posible aprobarla. Puedes comunicarte con nuestro equipo o enviar una nueva solicitud con información actualizada.',tone:'border-red-500/30 bg-red-500/10 text-red-100'}};
    async function consult(){const input=document.getElementById('trackingCode'),result=document.getElementById('statusResult'),button=document.getElementById('statusButton'),code=input.value.trim().toUpperCase();if(!/^SOL-[A-Z0-9]{6,16}$/.test(code)){result.className='mt-6 rounded-2xl border p-5 border-red-500/30 bg-red-500/10 text-red-100';result.innerHTML='<b>Código no válido</b><p class="text-sm mt-1">Revisa el código e inténtalo nuevamente.</p>';result.classList.remove('hidden');return;}button.disabled=true;button.textContent='Consultando…';try{const snapshot=await db.collection('businessApplicationStatus').doc(code).get();if(!snapshot.exists)throw new Error('not-found');const data=snapshot.data(),state=states[data.status]||states.pending;let visit='';if(data.status==='approved'&&data.publicUrl){try{const url=new URL(data.publicUrl,location.origin);if(url.origin===location.origin)visit=`<a href="${url.href}" class="inline-block mt-4 bg-emerald-400 text-emerald-950 rounded-xl px-4 py-2 font-black"><i class="fa-solid fa-location-dot mr-2"></i>Ver mi parada</a>`;}catch(_){}}result.className=`mt-6 rounded-2xl border p-5 ${state.tone}`;result.innerHTML=`<div class="flex gap-4"><i class="fa-solid ${state.icon} text-2xl mt-1"></i><div><b class="text-lg">${state.title}</b><p class="text-sm mt-1 opacity-80">${state.text}</p>${visit}<span class="text-xs block mt-3 opacity-60">${code}</span></div></div>`;}catch(_){result.className='mt-6 rounded-2xl border p-5 border-gray-600 bg-white/5 text-gray-200';result.innerHTML='<b>No encontramos ese código</b><p class="text-sm mt-1 text-gray-400">Comprueba que esté completo. Las solicitudes antiguas pueden no disponer todavía de seguimiento en línea.</p>';}finally{result.classList.remove('hidden');button.disabled=false;button.textContent='Consultar';}}
    document.getElementById('statusForm').addEventListener('submit',event=>{event.preventDefault();consult();});const initial=new URLSearchParams(location.search).get('codigo');if(initial){document.getElementById('trackingCode').value=initial;consult();}
  </script>
</body></html>
