<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121212"><title>Mi Ruta | Visita Loja</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script><style>body{background:#f8f7f4}.card{background:#fff;border:1px solid #eee7df}.safe{padding-bottom:calc(6rem + env(safe-area-inset-bottom))}.route-step:not(:last-child):after{content:'';position:absolute;left:20px;top:42px;bottom:-18px;width:2px;background:#fed7aa}</style></head><body class="text-slate-900"><header class="sticky top-0 z-40 bg-[#121212]/95 backdrop-blur text-white border-b border-orange-500/30"><div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between"><a href="./" class="flex items-center gap-3"><img src="visita-loja-icon-512.png" class="w-11 h-11 rounded-full bg-white object-contain p-1" alt="Visita Loja"><div><b class="block">VISITA LOJA</b><span class="text-[10px] text-orange-400 font-bold">TU RECORRIDO</span></div></a><button onclick="openMyRoute()" class="bg-orange-600 rounded-xl px-3 py-2 text-sm font-black"><i class="fa-solid fa-route mr-1"></i>Mi Ruta <span id="routeCount" class="ml-1 bg-white text-orange-700 rounded-full px-1.5">0</span></button></div></header><main class="max-w-5xl mx-auto px-4 py-7 safe"><section class="rounded-3xl bg-gradient-to-br from-[#171717] via-[#262018] to-[#083344] text-white p-6 sm:p-9 overflow-hidden"><p class="text-orange-400 text-xs font-black tracking-widest">RECORRE LOJA A TU RITMO</p><h1 class="text-3xl sm:text-5xl font-black mt-2">Elige una ruta y síguela parada por parada.</h1><p class="text-slate-300 mt-3 max-w-2xl">Recorridos oficiales preparados desde Visita Loja. También puedes conservar tu propia selección en Mi Ruta.</p></section><div class="flex gap-2 overflow-x-auto py-5" id="filters"></div><section><div class="flex items-end justify-between gap-3"><div><p class="text-orange-600 text-xs font-black tracking-widest">RUTAS OFICIALES</p><h2 class="text-2xl font-black">Elige tu experiencia</h2></div></div><div id="routes" class="grid md:grid-cols-2 gap-4 mt-4"><div class="card rounded-2xl p-5 text-slate-500">Cargando rutas…</div></div></section></main><div id="routeSheet" class="hidden fixed inset-0 z-50 bg-black/60 p-0 sm:p-6" onclick="if(event.target===this)closeSheet()"><section class="absolute sm:relative bottom-0 inset-x-0 sm:inset-auto sm:max-w-2xl sm:mx-auto bg-white rounded-t-3xl sm:rounded-3xl max-h-[88dvh] overflow-y-auto p-5 pb-[calc(1.25rem+env(safe-area-inset-bottom))]"><div class="flex justify-between gap-3"><div><p class="text-orange-600 text-xs font-black">MI RUTA</p><h2 id="sheetTitle" class="text-2xl font-black">Tu recorrido</h2></div><button onclick="closeSheet()" class="w-11 h-11 rounded-full bg-slate-100"><i class="fa-solid fa-xmark"></i></button></div><div id="myRouteList" class="mt-5 space-y-4"></div><div class="grid grid-cols-2 gap-2 mt-5"><button onclick="shareRoute()" class="border rounded-xl py-3 font-bold"><i class="fa-solid fa-share-nodes mr-1"></i>Compartir</button><button onclick="clearRoute()" class="border border-red-200 text-red-600 rounded-xl py-3 font-bold">Limpiar</button></div></section></div><script>const firebaseConfig={apiKey:'AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE',authDomain:'cultura-y-cuchara.firebaseapp.com',projectId:'cultura-y-cuchara',storageBucket:'cultura-y-cuchara.firebasestorage.app',messagingSenderId:'974351327730',appId:'1:974351327730:web:08573026a46d1bb6598b6b'};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let routes=[],places=new Map(),active='Todas';const KEY='visita_loja_my_route_v2';const saved=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]').filter(Boolean)}catch{return[]}};function save(ids){localStorage.setItem(KEY,JSON.stringify([...new Set(ids)].slice(0,20)));renderCount()}function renderCount(){document.getElementById('routeCount').textContent=saved().length}function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{const [cfg,locs]=await Promise.all([db.collection('settings').doc('touristRoutes').get(),db.collection('locales').get()]);locs.forEach(d=>places.set(d.id,{id:d.id,...d.data()}));routes=(cfg.exists&&Array.isArray(cfg.data().routes)?cfg.data().routes:[]).filter(r=>r.active!==false);renderFilters();renderRoutes()}catch(e){document.getElementById('routes').innerHTML='<div class="card rounded-2xl p-5 text-red-600">No pudimos cargar las rutas. Intenta nuevamente.</div>'}}function renderFilters(){const cats=['Todas',...new Set(routes.map(r=>r.category||'General'))];filters.innerHTML=cats.map(c=>`<button onclick="active='${esc(c)}';renderFilters();renderRoutes()" class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-bold ${active===c?'bg-[#121212] text-white':'bg-white border'}">${esc(c)}</button>`).join('')}function renderRoutes(){const list=routes.filter(r=>active==='Todas'||(r.category||'General')===active);document.getElementById('routes').innerHTML=list.length?list.map(r=>{const ids=(r.placeIds||[]).filter(id=>places.has(id));return `<article class="card rounded-3xl overflow-hidden shadow-sm"><div class="h-40 bg-slate-900 relative">${r.image?`<img src="${esc(r.image)}" class="w-full h-full object-cover" alt="">`:''}<div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div><span class="absolute left-4 bottom-4 bg-orange-600 text-white rounded-full px-3 py-1 text-xs font-black">${esc(r.category||'Ruta')}</span></div><div class="p-5"><h3 class="text-xl font-black">${esc(r.name||'Ruta Visita Loja')}</h3><p class="text-sm text-slate-600 mt-2">${esc(r.description||'')}</p><div class="flex gap-3 text-xs font-bold text-slate-500 mt-3"><span><i class="fa-solid fa-location-dot text-orange-600"></i> ${ids.length} paradas</span>${r.duration?`<span><i class="fa-regular fa-clock"></i> ${esc(r.duration)}</span>`:''}</div><button onclick='startOfficial(${JSON.stringify(r.id||r.name)})' class="w-full mt-4 bg-orange-600 text-white rounded-xl py-3 font-black">Usar esta ruta</button></div></article>`}).join(''):'<div class="card rounded-2xl p-5 text-slate-500">Aún no hay rutas publicadas en esta categoría.</div>'}function startOfficial(id){const r=routes.find(x=>(x.id||x.name)===id);if(!r)return;save((r.placeIds||[]).filter(x=>places.has(x)));document.getElementById('sheetTitle').textContent=r.name||'Mi Ruta';openMyRoute()}function openMyRoute(){renderMyRoute();routeSheet.classList.remove('hidden')}function closeSheet(){routeSheet.classList.add('hidden')}function renderMyRoute(){const ids=saved();myRouteList.innerHTML=ids.length?ids.map((id,i)=>{const p=places.get(id)||{name:'Parada',id};return `<div class="route-step relative flex gap-3"><span class="relative z-10 w-10 h-10 rounded-full bg-orange-600 text-white grid place-items-center font-black shrink-0">${i+1}</span><div class="min-w-0 flex-1 border rounded-2xl p-3"><b>${esc(p.name||p.title||'Parada')}</b><p class="text-xs text-slate-500 mt-1">${esc(p.address||p.location||'')}</p><div class="flex gap-2 mt-2"><a href="negocio.html?id=${encodeURIComponent(id)}" class="text-xs font-black text-orange-700">Ver parada</a><button onclick="removeStop('${encodeURIComponent(id)}')" class="text-xs text-red-500">Quitar</button></div></div></div>`}).join(''):'<div class="rounded-2xl bg-slate-50 p-5 text-center text-slate-500">Tu ruta está vacía. Elige una ruta oficial para comenzar.</div>'}function removeStop(id){save(saved().filter(x=>x!==decodeURIComponent(id)));renderMyRoute()}function clearRoute(){save([]);renderMyRoute()}async function shareRoute(){const names=saved().map(id=>places.get(id)?.name).filter(Boolean);const text='Mi Ruta en Visita Loja:\n'+names.map((n,i)=>`${i+1}. ${n}`).join('\n');try{if(navigator.share)await navigator.share({title:'Mi Ruta | Visita Loja',text,url:location.href});else{await navigator.clipboard.writeText(text+'\n'+location.href);alert('Ruta copiada.')}}catch(e){}}renderCount();load();</script></body></html>
