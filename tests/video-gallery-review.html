<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Galería de videos · Prueba aislada</title><link rel="stylesheet" href="/css/video-gallery.css?v=1"><link rel="stylesheet" href="/css/admin-video-gallery.css?v=1"><style>body{margin:0;font-family:system-ui;background:#f2f7fc}body>header{padding:20px;background:#0c3153;color:white}main{max-width:1200px;margin:auto;padding:20px}#editor{max-width:900px;margin:auto}</style><body><header><strong>Vista de prueba · VisitaLoja.com</strong><p>Contenido de demostración. No se publica ni modifica la base de datos. El clip de prueba solo comprueba el reproductor.</p><a href="#editor" style="color:white">Probar el administrador</a></header><section id="demo-gallery" class="video-gallery"></section><main><section id="editor"></section></main><script src="/js/video-gallery-model.js?v=1"></script><script src="/js/video-gallery.js?v=1"></script><script src="/js/admin-video-gallery.js?v=1"></script><script>
const titles=['Una mirada a Loja','Historias que nos conectan','Sabores de nuestra tierra','Un paseo por la provincia','Loja desde otra perspectiva','Una pausa para descubrir','El viaje continúa'];
const photos=['atardecer-loja.webp','loja-puerta.webp','repe-lojano.webp','jipiro-laguna.webp','loja-centro.webp','eolicas-atardecer-panoramica.webp','luna-eolicas.webp'];
let saved={active:true,title:'Loja en video',description:'Una nueva forma de descubrir sus lugares, sus sabores y las historias de nuestra gente.',items:titles.map((title,i)=>({id:'demo-'+i,title,description:'Tarjeta de demostración · reemplaza este contenido por tus videos.',credit:'Vista de prueba',url:location.origin+'/tests/fixtures/video-gallery-test.mp4',thumbnail:location.origin+'/assets/photos/'+photos[i],published:true}))};
const viewer=VisitaLojaVideoGallery.mount(document.getElementById('demo-gallery'));viewer.configure(saved);
VisitaLojaAdminVideos.mount(document.getElementById('editor'),{load:async()=>JSON.parse(JSON.stringify(saved)),save:async value=>{saved=JSON.parse(JSON.stringify(value));viewer.configure(saved);}});
</script></body></html>
