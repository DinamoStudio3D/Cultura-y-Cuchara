<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Anuncios programados · VisitaLoja</title><link rel="stylesheet" href="/css/promo-dialog.css?v=1"><link rel="stylesheet" href="/css/admin-video-gallery.css?v=1"><script src="/js/popup-schedule.js?v=2"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf4fb;color:#17344f;font:15px/1.6 system-ui}main{max-width:850px;margin:32px auto;padding:24px}h1{font-size:30px;line-height:1.2}form{background:#fff;border:1px solid #b7d1e7;border-radius:24px;padding:26px;box-shadow:0 8px 30px #0a375e0d}fieldset{min-width:0;padding:20px;border:1px solid #8fbbdf;border-radius:16px;background:#edf6ff;margin:20px 0}legend{font-weight:800;color:#075bb2}fieldset .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:block;font-weight:700}input[type=datetime-local]{display:block;width:100%;min-width:0;margin-top:8px;padding:12px;border-radius:10px;border:1px solid #a6c0d7;color:#17344f;background:#fff;font:inherit}button{min-height:44px;padding:10px 16px;border:1px solid #9fbfdc;border-radius:10px;background:#fff;color:#075bb2;font:750 13px system-ui;cursor:pointer}button.primary{background:#075bb2;color:white}.actions{display:flex;flex-wrap:wrap;gap:12px}#popupSchedulePreview{font-weight:750;color:#075bb2}small{color:#537088}#promoPopupModal .vl-promo-card{background:#fff;color:#17344f}@media(max-width:600px){main{padding:16px;margin:12px auto}form{padding:18px}fieldset{padding:14px}fieldset .grid{grid-template-columns:1fr}}</style><style>input:not([type=checkbox]),textarea{display:block;width:100%;padding:12px;border:1px solid #a6c0d7;border-radius:10px;background:white;color:#17344f;font:inherit}.video-admin-form{color:#17344f}.video-admin-form h3{color:#075bb2}</style><link rel="stylesheet" href="/css/admin-announcements.css?v=1"></head><body><main><p>VISITALOJA · PREVIEW</p><h1>Varios anuncios, uno a la vez</h1><p>Este es el mismo editor del administrador. Puedes probarlo sin modificar la web publicada.</p><section id="queueDemo"></section><p id="cycleStatus" role="status">Demostración local.</p><button id="quickCycle" type="button">Probar dos anuncios consecutivos</button></main><dialog id="promoPopupModal" class="hidden" aria-labelledby="popupTitleText" aria-describedby="popupDescText" aria-hidden="true">
      <article class="vl-promo-card" data-vl-surface="light">
        <header class="vl-promo-header"><span>VisitaLoja.com</span><button type="button" class="vl-promo-close" aria-label="Cerrar anuncio" onclick="closeModal('promoPopupModal')">✕</button></header>
        <div class="vl-promo-image"><img id="popupImgEl" src="/assets/photos/loja-centro.webp" alt="Imagen del anuncio" decoding="async"></div>
        <div class="vl-promo-content">
          <span id="popupBadgeText" class="vl-promo-badge">Anuncio especial</span>
          <h3 id="popupTitleText">¡Promoción especial!</h3>
          <p id="popupDescText"></p>
          <a id="popupWhatsappBtn" href="#" target="_blank" rel="noopener noreferrer" class="hidden"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Consultar disponibilidad</a>
          <button type="button" class="vl-promo-continue" onclick="closeModal('promoPopupModal')">Continuar navegando</button>
        </div>
      </article>
    </dialog><script src="/js/promo-dialog.js?v=1"></script><script src="/js/admin-announcements.js?v=2"></script><script>
const M=VisitaLojaPopupSchedule,$=id=>document.getElementById(id);
function closeModal(){$('promoPopupModal').classList.add('hidden');VisitaLojaPromoDialog.close();$('promoPopupModal').setAttribute('aria-hidden','true');}
const controller=M.create({show(value){if(document.hidden)return false;$('popupTitleText').textContent=value.popupTitle;$('popupDescText').textContent=value.popupDesc;$('promoPopupModal').classList.remove('hidden');$('promoPopupModal').setAttribute('aria-hidden','false');VisitaLojaPromoDialog.open();$('cycleStatus').textContent='Mostrando: '+value.popupTitle;return true;},hide(){closeModal();$('cycleStatus').textContent='Esperando el siguiente anuncio.';}});
const day=new Date(Date.now()+86400000).toISOString().slice(0,10);let queue={active:true,items:[{id:'demo-one',popupActive:true,popupTitle:'Descubre Loja este fin de semana',popupDesc:'Ejemplo de anuncio programado. Sustituye este mensaje por tu campaña.',popupStartsAt:M.fromInput(day+'T09:00'),popupEndsAt:M.fromInput(day+'T12:00')},{id:'demo-two',popupActive:true,popupTitle:'Una tarde para disfrutar Loja',popupDesc:'Un segundo anuncio para otro horario.',popupStartsAt:M.fromInput(day+'T12:00'),popupEndsAt:M.fromInput(day+'T18:00')}]};
VisitaLojaAdminAnnouncements.mount($('queueDemo'),{async load(){return{value:queue,baseline:JSON.stringify(queue)};},async save(value){queue=value;controller.update({popupQueue:queue});return JSON.stringify(queue);}});
$('quickCycle').onclick=()=>{const now=Date.now(),iso=n=>new Date(n).toISOString();controller.update({popupQueue:{active:true,items:[{id:'cycle-a-'+now,popupActive:true,popupTitle:'Primer anuncio',popupDesc:'Se retira automáticamente antes del siguiente.',popupStartsAt:iso(now+2000),popupEndsAt:iso(now+10000)},{id:'cycle-b-'+now,popupActive:true,popupTitle:'Segundo anuncio',popupDesc:'Aparece solo cuando termina el primero.',popupStartsAt:iso(now+10000),popupEndsAt:iso(now+20000)}]}});$('cycleStatus').textContent='Ciclo iniciado: dos anuncios durante los próximos 20 segundos.';};
document.addEventListener('visibilitychange',()=>controller.check());window.addEventListener('focus',()=>controller.check());
</script></body></html>
