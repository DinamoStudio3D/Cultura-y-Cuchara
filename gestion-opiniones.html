<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opiniones | Administración</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script><style>body{background:#080b0a}.card{background:#101513;border:1px solid rgba(255,255,255,.1)}.field{background:#080b0a;border:1px solid rgba(255,255,255,.14);border-radius:.75rem;padding:.75rem}</style></head><body class="text-white min-h-screen"><header class="border-b border-white/10"><div class="max-w-6xl mx-auto p-4 flex justify-between items-center"><div><p class="text-amber-300 text-xs font-black tracking-widest">ADMINISTRACIÓN</p><h1 class="text-xl font-black">Opiniones verificadas</h1></div><a href="admin.html" class="border border-white/15 rounded-xl px-3 py-2 text-sm">Panel principal</a></div></header><main class="max-w-6xl mx-auto p-4 py-8"><section id="login" class="card max-w-md mx-auto rounded-3xl p-6"><h2 class="text-xl font-black">Acceso administrativo</h2><form id="loginForm" class="space-y-3 mt-5"><input id="email" type="email" class="field w-full" placeholder="Correo" required><input id="password" type="password" class="field w-full" placeholder="Contraseña" required><button class="w-full bg-amber-500 text-amber-950 rounded-xl py-3 font-black">Ingresar</button><p id="loginMsg" class="text-red-300 text-sm"></p></form></section><section id="app" class="hidden"><div class="grid grid-cols-3 gap-3"><div class="card rounded-2xl p-4"><b id="total" class="text-2xl text-cyan-300">0</b><span class="block text-xs text-gray-500">Total</span></div><div class="card rounded-2xl p-4"><b id="published" class="text-2xl text-emerald-300">0</b><span class="block text-xs text-gray-500">Publicadas</span></div><div class="card rounded-2xl p-4"><b id="hidden" class="text-2xl text-amber-300">0</b><span class="block text-xs text-gray-500">Ocultas</span></div></div><section class="card rounded-3xl p-5 mt-5"><div class="flex flex-col sm:flex-row justify-between gap-3"><div><p class="text-amber-300 text-xs font-black tracking-widest">MODERACIÓN</p><h2 class="text-xl font-black">Experiencias de visitantes</h2></div><div class="flex gap-2"><select id="filter" onchange="render()" class="field"><option value="all">Todas</option><option value="published">Publicadas</option><option value="hidden">Ocultas</option></select><input id="search" oninput="render()" class="field" placeholder="Buscar"></div></div><div id="list" class="space-y-3 mt-5"></div></section></section></main><script>
const firebaseConfig={apiKey:"AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE",authDomain:"cultura-y-cuchara.firebaseapp.com",projectId:"cultura-y-cuchara",storageBucket:"cultura-y-cuchara.firebasestorage.app",messagingSenderId:"974351327730",appId:"1:974351327730:web:08573026a46d1bb6598b6b"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),ADMIN='sukogames1996@gmail.com';let data=[];const el=id=>document.getElementById(id),safe=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
auth.onAuthStateChanged(u=>{const ok=u&&u.email===ADMIN;el('login').classList.toggle('hidden',ok);el('app').classList.toggle('hidden',!ok);if(ok)load()});el('loginForm').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword(el('email').value.trim(),el('password').value)}catch(_){el('loginMsg').textContent='No se pudo ingresar.'}};
async function load(){const s=await db.collection('verifiedReviews').get();data=s.docs.map(d=>({id:d.id,...d.data()}));render()}
function render(){const f=el('filter').value,q=el('search').value.toLowerCase(),list=data.filter(x=>(f==='all'||x.status===f)&&(!q||[x.userName,x.placeName,x.comment].some(v=>String(v||'').toLowerCase().includes(q)))).sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));el('total').textContent=data.length;el('published').textContent=data.filter(x=>x.status==='published').length;el('hidden').textContent=data.filter(x=>x.status==='hidden').length;el('list').innerHTML=list.length?list.map(x=>'<article class="bg-black/20 border border-white/10 rounded-2xl p-4"><div class="flex justify-between gap-3"><div><b>'+safe(x.userName||'Visitante')+'</b><p class="text-xs text-gray-500">'+safe(x.placeName||x.placeId)+'</p><p class="text-amber-400">'+('★'.repeat(Number(x.rating)||0))+'</p></div><span class="text-xs '+(x.status==='published'?'text-emerald-300':'text-amber-300')+'">'+(x.status==='published'?'Publicada':'Oculta')+'</span></div><p class="text-gray-300 mt-3 whitespace-pre-line">'+safe(x.comment)+'</p><div class="flex gap-2 mt-4"><button onclick="setStatus(\''+safe(x.id)+'\',\''+(x.status==='published'?'hidden':'published')+'\')" class="border border-amber-500/25 text-amber-200 rounded-lg px-3 py-2 text-xs">'+(x.status==='published'?'Ocultar':'Publicar')+'</button><button onclick="removeReview(\''+safe(x.id)+'\')" class="border border-red-500/25 text-red-200 rounded-lg px-3 py-2 text-xs">Eliminar</button></div></article>').join(''):'<p class="text-gray-500 text-center py-8">No existen resultados.</p>'}
async function setStatus(id,status){await db.collection('verifiedReviews').doc(id).update({status,moderatedAt:firebase.firestore.FieldValue.serverTimestamp(),moderatedBy:auth.currentUser.email});await load()}async function removeReview(id){if(!confirm('¿Eliminar esta opinión definitivamente?'))return;await db.collection('verifiedReviews').doc(id).delete();await load()}
</script></body></html>
