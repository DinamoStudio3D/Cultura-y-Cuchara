<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mi negocio | Visita Loja</title><script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script></head>
<body class="min-h-screen bg-slate-950 text-white"><main class="max-w-3xl mx-auto p-4 sm:p-8"><a href="merchant-dashboard.html" class="text-cyan-300">← Volver al panel</a><section class="mt-5 bg-slate-900 border border-white/10 rounded-3xl p-5 sm:p-7"><p class="text-cyan-300 text-xs font-black tracking-widest">AUTOGESTIÓN</p><h1 class="text-3xl font-black mt-1">Mi negocio</h1><p class="text-slate-400 mt-2">Edita únicamente la información pública permitida de tus paradas.</p><div id="loading" class="mt-8 text-slate-400">Comprobando acceso…</div><div id="login" class="hidden mt-8"><button id="google" class="w-full bg-white text-slate-950 rounded-xl p-3 font-black">Ingresar con Google</button></div><div id="denied" class="hidden mt-8 text-amber-300">Esta cuenta no tiene paradas autorizadas.</div><form id="form" class="hidden mt-7 space-y-4"><label class="block"><span class="text-sm text-slate-300">Parada</span><select id="place" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></select></label><label class="block"><span class="text-sm text-slate-300">Descripción</span><textarea id="description" maxlength="1200" rows="6" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></textarea></label><div class="grid sm:grid-cols-2 gap-4"><label><span class="text-sm text-slate-300">Teléfono</span><input id="phone" maxlength="30" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label><label><span class="text-sm text-slate-300">WhatsApp</span><input id="whatsapp" maxlength="30" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3"></label></div><label class="block"><span class="text-sm text-slate-300">Horarios</span><textarea id="hours" maxlength="600" rows="4" class="mt-1 w-full bg-slate-950 border border-slate-700 rounded-xl p-3" placeholder="Ej. Lun–Vie 08:00–20:00"></textarea></label><div class="flex gap-3"><button id="save" class="bg-cyan-400 text-cyan-950 rounded-xl px-5 py-3 font-black">Guardar cambios</button><button type="button" id="logout" class="border border-white/20 rounded-xl px-5 py-3">Salir</button></div><p id="message" class="text-sm"></p></form></section></main>
<script>
const firebaseConfig={apiKey:"AIzaSyAfPB59mntjuK7Yi8H-Bn9fUGdpJzTrRYE",authDomain:"cultura-y-cuchara.firebaseapp.com",projectId:"cultura-y-cuchara",storageBucket:"cultura-y-cuchara.firebasestorage.app",messagingSenderId:"974351327730",appId:"1:974351327730:web:08573026a46d1bb6598b6b"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);let merchant=null,places=[];
function show(id){['loading','login','denied','form'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function value(data,names){for(const name of names){if(typeof data[name]==='string')return data[name]}return''}
function loadPlace(){const p=places.find(x=>x.id===$('place').value);if(!p)return;$('description').value=value(p,['description','descripcion','desc']);$('phone').value=value(p,['phone','telefono','tel']);$('whatsapp').value=value(p,['whatsapp','whatsApp']);$('hours').value=value(p,['hours','horarios','schedule'])}
async function load(){const ids=(merchant.placeIds||[]).slice(0,20),docs=await Promise.all(ids.map(id=>db.collection('locales').doc(id).get()));places=docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));if(!places.length){show('denied');return}$('place').innerHTML=places.map(p=>'<option value="'+p.id.replace(/"/g,'&quot;')+'">'+String(p.title||p.name||p.id).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</option>').join('');show('form');loadPlace()}
$('place').onchange=loadPlace;$('form').onsubmit=async e=>{e.preventDefault();const id=$('place').value;if(!merchant.placeIds.includes(id))return;const save=$('save'),message=$('message');save.disabled=true;message.textContent='Guardando…';try{await db.collection('locales').doc(id).update({description:$('description').value.trim(),phone:$('phone').value.trim(),whatsapp:$('whatsapp').value.trim(),hours:$('hours').value.trim(),merchantUpdatedAt:firebase.firestore.FieldValue.serverTimestamp(),merchantUpdatedBy:auth.currentUser.uid});const i=places.findIndex(x=>x.id===id);places[i]={...places[i],description:$('description').value.trim(),phone:$('phone').value.trim(),whatsapp:$('whatsapp').value.trim(),hours:$('hours').value.trim()};message.className='text-sm text-emerald-300';message.textContent='Cambios guardados correctamente.'}catch(err){message.className='text-sm text-red-300';message.textContent='No se pudo guardar. Verifica que las reglas de Firestore de esta versión estén publicadas.'}finally{save.disabled=false}};
auth.onAuthStateChanged(async user=>{if(!user){show('login');return}try{const d=await db.collection('missionRewardMerchants').doc(user.uid).get();if(!d.exists||d.data().active!==true||!(d.data().placeIds||[]).length){show('denied');return}merchant={id:user.uid,...d.data()};await load()}catch(_){show('denied')}});$('google').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());$('logout').onclick=()=>auth.signOut();
</script></body></html>
