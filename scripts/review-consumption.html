<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prueba aislada de consumos | VisitaLoja</title><script src="/functions/loyalty-consumption.js?v=1"></script><style>body{font:16px/1.5 system-ui;margin:0;background:#10263d;color:#fff}main{max-width:640px;margin:auto;padding:28px 20px}h1{font-size:28px}p{color:#dbe7f5}label{display:block;margin-top:16px}input,select,textarea,button{box-sizing:border-box;display:block;width:100%;padding:12px;margin-top:7px;border-radius:10px;border:1px solid #abc6df;font:inherit;background:#fff;color:#17324f}input:disabled{background:#ccd7e2}button{background:#f4ce88;color:#30210b;font-weight:bold;cursor:pointer;margin-top:20px}output{display:block;white-space:pre-wrap;margin-top:20px;padding:16px;border:1px solid #a6ccec;border-radius:12px;background:#183952;color:#fff}[hidden]{display:none!important}</style></head><body><main><p>DEMOSTRACIÓN AISLADA · SIN FIREBASE</p><h1>Compra, cortesía o visita turística</h1><p>Prueba la misma validación utilizada por la pantalla de confirmación y el servidor. Este formulario no registra visitas ni modifica datos.</p><label>Tipo de parada<select id="placeType"><option value="cafeteria">Negocio</option><option value="turismo">Lugar turístico</option></select></label><label>Mínimo configurado para sello ($)<input id="minimum" type="number" min="0" value="0" step="0.01"></label><div class="mt-4 space-y-3"><label class="block"><span class="text-sm font-bold block mb-2">Tipo de registro</span><select id="consumptionKind" class="field"><option value="purchase">Compra o consumo</option><option value="courtesy">Cortesía sin consumo</option><option value="tourism" hidden>Visita turística sin consumo</option></select></label><label id="courtesyReasonWrap" class="block" hidden><span class="text-sm font-bold block mb-2">Motivo de la cortesía (obligatorio)</span><textarea id="courtesyReason" class="field" minlength="5" maxlength="240" placeholder="Indica por qué se concede este sello sin compra"></textarea></label><p id="consumptionHelp" class="text-sm text-sky-100"></p></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4"><label><span class="text-sm font-bold block mb-2">Valor consumido (obligatorio para compra)</span><input id="purchaseAmount" class="field" inputmode="decimal" type="number" min="0" max="100000" step="0.01" placeholder="$ 0,00"></label><label><span class="text-sm font-bold block mb-2">Factura o nota de venta (opcional)</span><input id="receiptRef" class="field" maxlength="80" placeholder="Ej. 001-001-000123"></label></div><button id="validate" type="button">Comprobar registro (sin guardar)</button><output id="out" aria-live="polite">Completa los datos para comprobar la validación.</output></main><script>const kind=document.getElementById('consumptionKind'),purchaseAmount=document.getElementById('purchaseAmount'),courtesyReason=document.getElementById('courtesyReason');let currentPlace={category:'cafeteria'},currentProgram={minimumSpend:0};function syncConsumptionFields(){const purchase=kind.value==='purchase';purchaseAmount.disabled=!purchase;purchaseAmount.required=purchase;purchaseAmount.min=purchase?'0.01':'0';document.getElementById('courtesyReasonWrap').hidden=kind.value!=='courtesy';courtesyReason.required=kind.value==='courtesy';if(!purchase)purchaseAmount.value='0';else if(purchaseAmount.value==='0')purchaseAmount.value='';document.getElementById('consumptionHelp').textContent=kind.value==='tourism'?'Esta visita turística no requiere compra.':purchase?'Registra el importe real. Mínimo para sello: $'+Number(currentProgram.minimumSpend||0).toFixed(2)+'.':'La cortesía queda identificada y auditada; no se presenta como una compra.';}
kind.onchange=syncConsumptionFields;document.getElementById('minimum').oninput=()=>{currentProgram.minimumSpend=Number(document.getElementById('minimum').value);syncConsumptionFields()};document.getElementById('placeType').onchange=e=>{currentPlace.category=e.target.value;kind.value=currentPlace.category==='turismo'?'tourism':'purchase';kind.disabled=currentPlace.category==='turismo';syncConsumptionFields()};document.getElementById('validate').onclick=()=>{try{const result=window.VisitaLojaConsumption.validate({recordKind:kind.value,purchaseAmount:purchaseAmount.value,consumptionReason:courtesyReason.value,receiptRef:document.getElementById('receiptRef').value},currentPlace,currentProgram);document.getElementById('out').textContent='VÁLIDO · SIN GUARDAR\n'+JSON.stringify(result,null,2)}catch(e){document.getElementById('out').textContent=e.message}};syncConsumptionFields();</script></body></html>
