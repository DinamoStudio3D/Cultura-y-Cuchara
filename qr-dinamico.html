<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Referrer-Policy" content="no-referrer">
  <title>Visita Loja · Enlace QR</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff7ed;color:#292524}.card{width:min(92vw,520px);padding:32px;border:1px solid #fed7aa;border-radius:22px;background:#fff;box-shadow:0 18px 55px rgba(124,45,18,.10);text-align:center}.mark{width:58px;height:58px;margin:0 auto 16px;border-radius:18px;display:grid;place-items:center;background:#f97316;color:#fff;font-size:28px;font-weight:800}h1{font-size:1.35rem;margin:0 0 10px}p{line-height:1.55;margin:0;color:#57534e}.error{color:#9a3412}.small{margin-top:18px;font-size:.85rem;color:#78716c}</style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="mark">VL</div>
    <h1 id="title">Abriendo enlace de Visita Loja…</h1>
    <p id="message">Estamos comprobando el destino de este código QR.</p>
    <p class="small">VisitaLoja.com</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script>
    (() => {
      'use strict';
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const fail = (text) => { title.textContent = 'Este enlace no está disponible'; message.textContent = text; message.className = 'error'; };
      const match = location.pathname.match(/^\/q\/([A-Za-z0-9_-]{6,64})\/?$/);
      if (!match) { fail('El código QR no es válido.'); return; }
      const qrId = match[1];
      const firebaseConfig = {
        apiKey: "AIzaSyD5lA7ZEG_G3qGn3Yc8cYz4bY1n4xgV9lI",
        authDomain: "cultura-y-cuchara.firebaseapp.com",
        projectId: "cultura-y-cuchara",
        storageBucket: "cultura-y-cuchara.firebasestorage.app",
        messagingSenderId: "987854136999",
        appId: "1:987854136999:web:4e785f4f4ab87684553275"
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

      // Esta colección contiene exclusivamente el mínimo dato público necesario
      // para resolver un QR. Nombre, creador, historial y configuración viven en
      // la colección administrativa privada dynamicMarketingQrs.
      firebase.firestore().collection('dynamicQrPublic').doc(qrId).get()
        .then((snap) => {
          if (!snap.exists) throw new Error('missing');
          const data = snap.data() || {};
          if (data.status !== 'active') { fail('Este código QR está temporalmente desactivado.'); return; }
          let destination;
          try { destination = new URL(String(data.destinationUrl || '')); } catch (_) { throw new Error('invalid'); }
          if (destination.protocol !== 'https:' || destination.username || destination.password) throw new Error('invalid');
          location.replace(destination.href);
        })
        .catch(() => fail('No pudimos encontrar un destino válido para este código.'));
    })();
  </script>
</body>
</html>
