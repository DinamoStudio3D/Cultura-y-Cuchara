name: Add Visita Loja social links

on:
  push:
    branches:
      - feature/rutas-turisticas-movil

permissions:
  contents: write

jobs:
  patch-social-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rutas-turisticas-movil
      - name: Add social links to footer and structured data
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="mt-2 flex flex-wrap justify-center md:justify-end gap-3"><a href="/privacidad.html" class="hover:text-brandGold underline">Privacidad</a><a href="/terminos.html" class="hover:text-brandGold underline">Términos de uso</a></div>'
          new = '<div class="mt-3"><p class="text-[10px] uppercase tracking-[0.18em] font-black text-gray-400 mb-2">Síguenos</p><div class="flex flex-wrap justify-center md:justify-end gap-2" aria-label="Redes sociales oficiales de Visita Loja"><a href="https://www.youtube.com/@VisitaLoja" target="_blank" rel="noopener noreferrer" aria-label="Visita Loja en YouTube" title="YouTube" class="w-10 h-10 rounded-full border border-white/15 bg-white/5 hover:bg-red-600 hover:text-white hover:border-red-600 transition flex items-center justify-center text-base"><i class="fa-brands fa-youtube" aria-hidden="true"></i></a><a href="https://www.tiktok.com/@visitaloja.com" target="_blank" rel="noopener noreferrer" aria-label="Visita Loja en TikTok" title="TikTok" class="w-10 h-10 rounded-full border border-white/15 bg-white/5 hover:bg-white hover:text-black hover:border-white transition flex items-center justify-center text-base"><i class="fa-brands fa-tiktok" aria-hidden="true"></i></a><a href="https://www.instagram.com/visitaloja.oficial/" target="_blank" rel="noopener noreferrer" aria-label="Visita Loja en Instagram" title="Instagram" class="w-10 h-10 rounded-full border border-white/15 bg-white/5 hover:bg-pink-600 hover:text-white hover:border-pink-600 transition flex items-center justify-center text-base"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a><a href="https://www.facebook.com/visitalojaoficial/" target="_blank" rel="noopener noreferrer" aria-label="Visita Loja en Facebook" title="Facebook" class="w-10 h-10 rounded-full border border-white/15 bg-white/5 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition flex items-center justify-center text-base"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></a></div></div><div class="mt-3 flex flex-wrap justify-center md:justify-end gap-3"><a href="/privacidad.html" class="hover:text-brandGold underline">Privacidad</a><a href="/terminos.html" class="hover:text-brandGold underline">Términos de uso</a></div>'
          if old not in s:
              raise SystemExit('Footer esperado no encontrado')
          s = s.replace(old, new, 1)
          anchor = '          "name": "Visita Loja",\n          "url": "https://visita-loja.vercel.app/",\n          "logo": {'
          replacement = '          "name": "Visita Loja",\n          "url": "https://visita-loja.vercel.app/",\n          "sameAs": [\n            "https://www.youtube.com/@VisitaLoja",\n            "https://www.tiktok.com/@visitaloja.com",\n            "https://www.instagram.com/visitaloja.oficial/",\n            "https://www.facebook.com/visitalojaoficial/"\n          ],\n          "logo": {'
          if anchor not in s:
              raise SystemExit('Organization JSON-LD esperado no encontrado')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: agregar redes sociales oficiales al footer"
          git push origin HEAD:feature/rutas-turisticas-movil
