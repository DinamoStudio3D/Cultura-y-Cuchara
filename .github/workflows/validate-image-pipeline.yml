name: Validate image pipeline

on:
  push:
    branches:
      - feature/cloudinary-images
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate image pipeline
        run: node scripts/validate-image-pipeline.mjs
