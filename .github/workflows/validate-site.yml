name: Validar Cultura y Cuchara

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Comprobar integridad de la web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar pruebas
        run: node scripts/validate-site.mjs
